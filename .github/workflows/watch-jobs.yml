name: watch-jobs

on:
  schedule:
    # Every 15 minutes, offset from :00 to avoid GitHub's busiest cron slots.
    # New repos can take a while before GitHub starts honoring the schedule;
    # a push touching this file re-registers it.
    # NOTE: on a PRIVATE repo change to "7,37 * * * *" (every 30 min) to stay
    # inside the 2000 free minutes per month.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 watcher.py

      - name: Persist seen-jobs state
        if: always()
        run: |
          if ! git diff --quiet -- state/seen_jobs.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/seen_jobs.json
            git commit -m "chore: update seen jobs"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
